<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Автомобили</title>
</head>
<body>
  <h1>Все автомобили</h1>
  <p><a href="{% url 'car_create' %}">Добавить автомобиль</a></p>
  <ul>
    {% for car in cars %}
      <li>
        <a href="{% url 'car_detail' car.pk %}">{{ car.brand }} {{ car.model }} ({{ car.license_plate }})</a>
        — <a href="{% url 'car_update' car.pk %}">Редактировать</a>
        | <a href="{% url 'car_delete' car.pk %}">Удалить</a>
      </li>
    {% empty %}
      <li>Автомобилей пока нет</li>
    {% endfor %}
  </ul>
  <p><a href="{% url 'owners_list' %}">К списку владельцев</a></p>
</body>
</html>
