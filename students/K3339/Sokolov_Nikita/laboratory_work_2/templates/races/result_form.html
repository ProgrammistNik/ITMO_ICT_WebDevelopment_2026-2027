{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1 class="mb-2">{{ title }}</h1>
<p class="text-muted mb-4">Гонка: {{ race.title }}</p>
<form method="post" class="col-lg-6">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label">Участник</label>
    <select name="entry" class="form-select" required>
      {% for e in form.fields.entry.queryset %}
        <option value="{{ e.pk }}" {% if form.entry.value|stringformat:"s" == e.pk|stringformat:"s" %}selected{% endif %}>{{ e.full_name }} ({{ e.team_name }})</option>
      {% endfor %}
    </select>
    {{ form.entry.errors }}
  </div>
  <div class="mb-3">
    <label class="form-label">Время заезда</label>
    <input type="text" name="finish_time" class="form-control" value="{{ form.finish_time.value|default:'' }}" placeholder="1:23.456" required>
    {{ form.finish_time.errors }}
  </div>
  <div class="mb-3">
    <label class="form-label">Место</label>
    <input type="number" name="place" class="form-control" min="1" value="{{ form.place.value|default:'' }}" required>
    {{ form.place.errors }}
  </div>
  <div class="mb-3">
    <label class="form-label">Заметки</label>
    <input type="text" name="notes" class="form-control" value="{{ form.notes.value|default:'' }}">
  </div>
  <button class="btn btn-accent" type="submit">Сохранить</button>
  <a href="{% url 'race_detail' race.pk %}" class="btn btn-outline-light">Отмена</a>
</form>
{% endblock %}
