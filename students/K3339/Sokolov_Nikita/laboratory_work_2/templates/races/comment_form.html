{% extends "base.html" %}
{% block title %}Комментарий{% endblock %}
{% block content %}
<h1 class="mb-2">Комментарий</h1>
<p class="text-muted mb-4">Гонка: {{ race.title }}</p>
<form method="post" class="col-lg-6">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label">Дата заезда</label>
    <input type="date" name="race_date" class="form-control" value="{{ form.race_date.value|default:race.date|date:'Y-m-d' }}" required>
    {{ form.race_date.errors }}
  </div>
  <div class="mb-3">
    <label class="form-label">Текст</label>
    <textarea name="text" class="form-control" rows="4" required>{{ form.text.value|default:'' }}</textarea>
    {{ form.text.errors }}
  </div>
  <div class="mb-3">
    <label class="form-label">Тип комментария</label>
    <select name="comment_type" class="form-select" required>
      {% for value, label in form.fields.comment_type.choices %}
        <option value="{{ value }}" {% if form.comment_type.value == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Рейтинг (1–10)</label>
    <input type="number" name="rating" class="form-control" min="1" max="10" value="{{ form.rating.value|default:'5' }}" required>
    {{ form.rating.errors }}
  </div>
  <button class="btn btn-accent" type="submit">Отправить</button>
  <a href="{% url 'race_detail' race.pk %}" class="btn btn-outline-light">Отмена</a>
</form>
{% endblock %}
