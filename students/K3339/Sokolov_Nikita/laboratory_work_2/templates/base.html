<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Табло автогонок{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --accent: #e85d04;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    body { background: linear-gradient(160deg, #0f1419 0%, #1a2332 50%, #0d1b2a 100%); color: var(--text); min-height: 100vh; }
    .navbar { background: rgba(15, 20, 25, 0.95) !important; border-bottom: 2px solid var(--accent); }
    .navbar-brand, .nav-link { color: var(--text) !important; }
    .nav-link:hover { color: var(--accent) !important; }
    .card, .table, .form-control, .form-select, .list-group-item {
      background: var(--panel); color: var(--text); border-color: #334155;
    }
    .table {
      --bs-table-bg: var(--panel);
      --bs-table-color: var(--text);
      --bs-table-border-color: #334155;
      --bs-table-striped-bg: #243044;
      --bs-table-striped-color: var(--text);
      --bs-table-hover-bg: #2d3a4f;
      --bs-table-hover-color: var(--text);
      color: var(--text);
    }
    .table > :not(caption) > * > * { color: var(--text); background-color: var(--bs-table-bg); }
    .form-control, .form-select { background: #0f1419; color: var(--text); border-color: #475569; }
    .form-control::placeholder { color: var(--muted); opacity: 1; }
    .form-control:focus, .form-select:focus { background: #0f1419; color: var(--text); border-color: var(--accent); box-shadow: 0 0 0 .2rem rgba(232,93,4,.25); }
    .form-select option { background: #0f1419; color: var(--text); }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-accent:hover { background: #f48c06; border-color: #f48c06; color: #fff; }
    .badge-staff { background: var(--accent); }
    h1, h2, h3 { letter-spacing: .02em; }
    .text-muted { color: var(--muted) !important; }
    a { color: #fb923c; }
    a:hover { color: #fdba74; }
    .pagination .page-link { background: var(--panel); border-color: #334155; color: var(--text); }
    .pagination .page-item.active .page-link { background: var(--accent); border-color: var(--accent); }
    .alert, .alert-secondary, .alert-info {
      background: #243044; color: var(--text); border: 1px solid #334155;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'race_list' %}">Racing Board</a>
    <div class="navbar-nav ms-auto gap-2 flex-row align-items-center">
      {% if user.is_authenticated %}
        <a class="nav-link" href="{% url 'my_entries' %}">Мои заявки</a>
        {% if user.is_staff %}
          <a class="nav-link" href="{% url 'race_create' %}">+ Гонка</a>
          <span class="badge badge-staff">админ</span>
        {% endif %}
        <span class="nav-link">{{ user.username }}</span>
        <a class="nav-link" href="{% url 'logout' %}">Выход</a>
      {% else %}
        <a class="nav-link" href="{% url 'login' %}">Вход</a>
        <a class="nav-link" href="{% url 'register' %}">Регистрация</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container pb-5">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-info">{{ message }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
